# Release the plugin: Actions → Release → Run workflow → enter a version.
# "0.0.1" and "v0.0.1" both release tag v0.0.1 (plugin.json gets 0.0.1).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.0.1 or v0.0.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag="$(./scripts/normalize-version.sh "$INPUT_VERSION")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          echo "Releasing $tag"

      - name: Refuse a tag that already exists
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists. Choose a new version."
            exit 1
          fi

      - name: Validate the plugin files
        run: |
          jq -e '.name and .version and .description' .claude-plugin/plugin.json > /dev/null
          jq -e '.name and .owner and (.plugins | length > 0)' .claude-plugin/marketplace.json > /dev/null
          jq -e '.mcpServers | length > 0' .mcp.json > /dev/null
          skill=skills/decodx-video/SKILL.md
          head -n 1 "$skill" | grep -qx -- '---'
          grep -q '^name: decodx-video$' "$skill"
          grep -q '^description:' "$skill"

      - name: Set the version in plugin.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' .claude-plugin/plugin.json > plugin.json.tmp
          mv plugin.json.tmp .claude-plugin/plugin.json

      - name: Commit, tag and push
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "Release $TAG"
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "$TAG"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=(--title "$TAG" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}"
